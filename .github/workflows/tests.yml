name: Automated CI Test Pipeline

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dataset Generation
        run: |
          python data/prepare_dataset.py

      - name: Train Models
        run: |
          python model/train_model.py

      - name: Run Streaming Simulator Verification
        run: |
          python pipeline/stream_simulator.py --batch-size 200 --delay 0.001 --max-records 1000

      - name: Execute Pytest Suite
        run: |
          python -m pytest tests/ -v
